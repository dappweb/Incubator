<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incubator</title>
    <meta name="description" content="Incubator — 去中心化 Web3 孵化平台，节点购买、OTC 交易、代币兑换全链上实现。" />
    <meta property="og:title" content="Incubator" />
    <meta property="og:description" content="去中心化 Web3 孵化平台，节点购买、OTC 交易、代币兑换全链上实现。" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // One-time auto-reload guard for stale lazy-loaded chunks after redeploy.
      // Pattern: "<Var> is not defined" or Vite "Failed to fetch dynamically imported module".
      (function () {
        var RELOAD_KEY = "__incubator_stale_reload_at";
        function maybeReload(msg) {
          if (!msg) return;
          var stale =
            /is not defined/.test(msg) ||
            /Failed to fetch dynamically imported module/.test(msg) ||
            /Importing a module script failed/.test(msg);
          if (!stale) return;
          var last = Number(sessionStorage.getItem(RELOAD_KEY) || 0);
          if (Date.now() - last < 15000) return; // avoid reload loop
          sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
          location.reload();
        }
        window.addEventListener("error", function (ev) {
          maybeReload(ev && ev.message);
        });
        window.addEventListener("unhandledrejection", function (ev) {
          var reason = ev && ev.reason;
          var msg = reason && (reason.message || String(reason));
          maybeReload(msg);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
